name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: beliefatlas
          POSTGRES_PASSWORD: beliefatlas
          POSTGRES_DB: beliefatlas
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U beliefatlas"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://beliefatlas:beliefatlas@localhost:5432/beliefatlas
      PHONE_PEPPER: ci-only-pepper
      MIN_GROUP_SIZE: "5"
      API_KEYS: ci-api-key
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Only the original 001-007 files keep 00N_ names; new ones are YYYYMMDD_HHMM_name.sql.
      - name: Check migration file names
        run: npx tsx scripts/ops/check-migrations.ts
      - run: npm run db:migrate:deploy
      - run: npm run db:seed:questions
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      # The runner's own pg_dump is newer than the Postgres 16 service and writes settings
      # (transaction_timeout) that 16 can't restore, so use the matching client tools.
      - name: Postgres 16 client tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client-16
          echo /usr/lib/postgresql/16/bin >> "$GITHUB_PATH"
      # Keeps the backup and restore scripts working: dump the CI database, restore it into a
      # scratch database, check the row counts, drop it.
      - name: Backup and restore drill
        env:
          BACKUP_DIR: ${{ runner.temp }}/backups
        run: |
          scripts/ops/backup.sh
          scripts/ops/restore-drill.sh
